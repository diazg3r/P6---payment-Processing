<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Square Web Payments Quickstart</title>
    <link href="app.css" rel="stylesheet" />

    <!-- 1. Cargamos el SDK externo de Square primero -->
    <script type="text/javascript" src="https://sandbox.web.squarecdn.com/v1/square.js"></script>

    <!-- 2. Bloque de código para nuestra lógica de ejecución -->
    <script>
      const appId = 'sandbox-sq0idb-JAc-ctIoIs4NkblgYM5fsQ';
      const locationId = 'LRTQEH075YXJ7'; 

      const verificationDetails = { 
        amount: '1.00',
        billingContact: {
          givenName: 'John',
          familyName: 'Doe',
          email: 'john.doe@square.example',
          phone: '3214563987',
          addressLines: ['123 Main Street', 'Apartment 1'],
          city: 'Oakland',
          state: 'CA',
          countryCode: 'US',
        },
        currencyCode: 'USD',
        intent: 'CHARGE',
        customerInitiated: true,
        sellerKeyedIn: false,
      };

      async function tokenize(card) {
        const tokenResult = await card.tokenize(verificationDetails);
        if (tokenResult.status === 'OK') {
          return tokenResult.token;
        } else {
          let errorMessage = `Tokenization failed-status: ${tokenResult.status}`;
          if (tokenResult.errors) {
            errorMessage += ` and errors: ${JSON.stringify(tokenResult.errors)}`;
          }
          throw new Error(errorMessage);
        }
      }

      function displayPaymentResults(status) {
        const statusContainer = document.getElementById('payment-status-container');
        if (status === 'SUCCESS') {
          statusContainer.classList.remove('is-failure');
          statusContainer.classList.add('is-success');
        } else {
          statusContainer.classList.remove('is-success');
          statusContainer.classList.add('is-failure');
        }
        statusContainer.style.visibility = 'visible';
      }    

      async function initializeCard(payments) {
        const card = await payments.card();
        await card.attach('#card-container'); 
        return card; 
      }

      async function CreatePayment(token) {
        const body = JSON.stringify({
          locationId,
          sourceId: token,
          idempotencyKey: window.crypto.randomUUID(),
        });

        const paymentResponse = await fetch('/payment', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body,
        });

        if (paymentResponse.ok) {
          return paymentResponse.json();
        }

        const errorBody = await paymentResponse.text();
        throw new Error(errorBody);
      }

      document.addEventListener('DOMContentLoaded', async function () {
        if (!window.Square) {
          throw new Error('Square.js failed to load properly');
        }

        let payments;
        try {
          payments = window.Square.payments(appId, locationId);
        } catch (e) {
          console.error(e);
          const statusContainer = document.getElementById('payment-status-container');
          statusContainer.className = 'missing-credentials';
          statusContainer.style.visibility = 'visible';
          return;
        }

        let card;
        try {
          card = await initializeCard(payments);
        } catch (e) {
          console.error('Initializing Card failed', e);
          return;
        }

        async function handlePaymentMethodSubmission(event, card) {
          event.preventDefault();

          try {
            cardButton.disabled = true;
            //const token = await tokenize(card);
            //const paymentResults = await CreatePayment(token);
            console.log('Step 1: Starting tokenization');
            const token = await tokenize(card);
            console.log('Step 2: Tokenization successful');
            const paymentResults = await CreatePayment(token);
            console.log('Step 3: Payment successful', paymentResults);
            
            displayPaymentResults('SUCCESS');
            console.debug('Payment Success', paymentResults);
          } catch (e) {
            cardButton.disabled = false;
            displayPaymentResults('FAILURE');
            console.error(e.message);
          }
        }

        const cardButton = document.getElementById('card-button');
        cardButton.addEventListener('click', async function(event) {
          await handlePaymentMethodSubmission(event, card);
        });
      });
    </script>
  </head>

  <body>
    <form id="payment-form">
      <div id="card-container"></div>
      <button id="card-button" type="button">Pay $1.00</button>
    </form>
    <div id="payment-status-container"></div>
  </body>
</html>
